name: Compress Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL del video a comprimir"
        required: true
        type: string
      chat_id:
        description: "Chat ID de Telegram donde responder"
        required: true
        type: string

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp with FFmpeg
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download video
        id: download
        run: |
          set -e
          URL="${{ github.event.inputs.video_url }}"

          if [[ "$URL" =~ \.(mp4|mkv|webm|mov|avi|m4v)(\?.*)?$ ]]; then
            echo "🔗 Enlace directo detectado, descargando con curl..."
            curl -L --fail -o input.mp4 "$URL"
          else
            echo "🎬 Enlace de plataforma detectado, descargando con yt-dlp..."
            yt-dlp \
              --no-playlist \
              --cookies cookies.txt \
              -f "bv*+ba/b" \
              --merge-output-format mp4 \
              -o "input.%(ext)s" \
              "$URL"
          fi

          INPUT=$(ls input.* | head -1)
          echo "input_file=$INPUT" >> $GITHUB_OUTPUT
          echo "Archivo descargado: $INPUT"
          ls -lh "$INPUT"

      - name: Compress with FFmpeg
        id: compress
        run: |
          set -e
          ffmpeg -y -i "${{ steps.download.outputs.input_file }}" \
            -c:v libx265 -crf 30 -preset slow \
            -vf "fps=24,scale=-2:240" \
            -c:a aac -b:a 96k \
            -movflags +faststart \
            output.mp4

          ls -lh output.mp4

      - name: Upload to litterbox
        id: upload
        run: |
          set -e
          LINK=$(curl -s -F "reqtype=fileupload" \
                      -F "time=72h" \
                      -F "fileToUpload=@output.mp4" \
                      https://litterbox.catbox.moe/resources/internals/api.php)
          echo "link=$LINK" >> $GITHUB_OUTPUT
          echo "Enlace generado: $LINK"

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.chat_id }}" \
            -d "text=✅ Video comprimido (360p, 24fps, 96kbps): ${{ steps.upload.outputs.link }}"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ github.event.inputs.chat_id }}" \
            -d "text=❌ Falló la compresión. Revisa los logs del workflow."

      - name: Cleanup cookies
        if: always()
        run: rm -f cookies.txt
