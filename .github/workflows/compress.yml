name: Compress Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL del video a comprimir"
        required: true
        type: string
      chat_id:
        description: "Chat ID de Telegram donde responder"
        required: true
        type: string

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup yt-dlp with FFmpeg
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Download video
        id: download
        run: |
          set -e
          URL="${{ github.event.inputs.video_url }}"

          if [[ "$URL" =~ \.(mp4|mkv|webm|mov|avi|m4v)(\?.*)?$ ]]; then
            echo "🔗 Enlace directo detectado, descargando con curl..."
            curl -L --fail -o input.mp4 "$URL"
          else
            echo "🎬 Enlace de plataforma detectado, descargando con yt-dlp..."
            yt-dlp \
              --no-playlist \
              --cookies cookies.txt \
              -f "bv*+ba/b" \
              --merge-output-format mp4 \
              -o "input.%(ext)s" \
              "$URL"
          fi

          INPUT=$(ls input.* | head -1)
          echo "input_file=$INPUT" >> $GITHUB_OUTPUT
          echo "Archivo descargado: $INPUT"
          ls -lh "$INPUT"

      - name: Compress with FFmpeg
        id: compress
        run: |
          set -e
          ffmpeg -y -i "${{ steps.download.outputs.input_file }}" \
            -map 0:v:0 -map 0:a \
            -c:v libx264 -crf 32 -preset slow \
            -vf "fps=24,scale=-2:144" \
            -c:a aac -ac 2 -b:a 32k \
            output.mp4

          ls -lh output.mp4

      - name: Upload to EasySend
        id: upload
        run: |
          set -e

          if [ ! -s output.mp4 ]; then
            echo "❌ output.mp4 no existe o está vacío"
            exit 1
          fi

          echo "📦 Tamaño: $(du -h output.mp4 | cut -f1)"

          RESPONSE=$(curl -s --http1.1 --retry 3 --retry-all-errors --retry-delay 5 \
            --max-time 600 -X POST \
            -F "files[]=@output.mp4" \
            https://easysend.co/api/v1/upload)

          echo "Respuesta: $RESPONSE"

          LINK=$(echo "$RESPONSE" | sed -n 's/.*"share_link":"\([^"]*\)".*/\1/p' | sed 's/\\\//\//g')

          if [[ ! "$LINK" =~ ^https?:// ]]; then
            echo "❌ EasySend no devolvió una URL válida: $LINK"
            exit 1
          fi

          echo "✅ Enlace generado: $LINK"
          echo "link=$LINK" >> $GITHUB_OUTPUT

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ github.event.inputs.chat_id }}" \
            --data-urlencode "text=✅ Video comprimido con éxito: ${{ steps.upload.outputs.link }}"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ github.event.inputs.chat_id }}" \
            --data-urlencode "text=❌ Fallo durante la compresión."

      - name: Cleanup cookies
        if: always()
        run: rm -f cookies.txt
